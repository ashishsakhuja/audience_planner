generate_sql_task:
  description: >
    Generate a precise SQL statement for the segments table based on the
    user's campaign query "{query}".
    **IMPORTANT** DO NOT APPEND LIMIT HERE. Return the full SELECT so we can count
    **IMPORTANT** DO NOT TRY AND MATCH INTERESTS OR PRODUCTS, analyze the query to determine which demographics to query for.
  expected_output: >
    A single SQL SELECT statement (ending with a semicolon).
  agent: database_guru

select_segment_task:
  description: |
    Search all segments loaded from the official knowledge source for the campaign query "{query}".  
    1. Take SQL from 'generate_sql_task'
        1. Wrap it in a COUNT query (use **size**, not "segment_size"):
        CALL SegmentSQLTool(query="
          SELECT COUNT(*) AS totalMatches
            FROM ({{context.generate_sql_task.pydantic.sql.rstrip(';')}}) AS sub;
          ")
    3. THIS COUNT IS YOUR "totalMatches" field.
       IMPORTANT: NOTE THAT THIS IS THE TOTAL MATCHING SEGMENTS, THIS SHOULD BE A LARGER NUMBER THAN 5.
    4. Call the SegmentSQLTool with the same SQL to get the full array of segments
    6. Then return a JSON object with these keys:
       {
         "totalMatches": <int>,
         "segments": [
           {
             "name": ...,
             "segmentId": ...,
             "age_range": ...,
             "income_level": ...,
             "location_type": ...,
             "recency": ...,
             "cpm": ...,
             "cpmCap": ...,
             "confidence": ...,
             "estimated_reach": ...,
             "size": ...,
             "programmaticMediaPct": ...,
             "advertiserDirectPct": ...,
             "category": ...,
             "quality_score": ...,
             "data_source": ...,
             "identityGraphName": ...
           }
         ]
       }
  expected_output: >
    JSON with keys: totalMatches and segments[]
  agent: segment_agent
  depends_on: [generate_sql_task]

validate_segment_task:
  description: >
    Validate whether the recommended segments match the campaign query: "{query}".
    For each recommended segment, cross-check every field with the source data.
    Return a JSON array of best 3-5 validated segments, each with:
    - all field values (or "Not provided")
    - match_status for each field: "Matches" or "Mismatch"
    - explanation for each field's match status
    
    IMPORTANT: DO NOT CHANGE THE totalMatches. THIS NUMBER MUST BE HIGHER THAN 5.
    Format:
    {
      "totalMatches": <int>,
      "validatedSegments": [
        {
          "name": ...,
          "segmentId": ...,
          "identityGraphName": ...,
          "age_range": {"value": ..., "status": ..., "explanation": ...},
          "size": {"value": ..., "status": ..., "explanation": ...},
          "income_level": {"value": ..., "status": ..., "explanation": ...},
          "location_type": {"value": ..., "status": ..., "explanation": ...},
          "recency": {"value": ..., "status": ..., "explanation": ...},
          "cpm": {"value": ..., "status": ..., "explanation": ...},
          "cpmCap": {"value": ..., "status": ..., "explanation": ...},
          "estReach": {"value": ..., "status": ..., "explanation": ...},
          "programmaticMediaPct": {"value": ..., "status": ..., "explanation": ...},
          "advertiserDirectPct": {"value": ..., "status": ..., "explanation": ...},
          "confidence": {"value": ..., "status": "Reported"},
          "category": {"value": ..., "explanation": ...},
          "quality_score": {"value": ..., "explanation": ...},
          "data_source": {"value": ..., "status": ..., "explanation": ...}
        }
      ],
      "summary": "..."
    }
  expected_output: >
    Full validated segment output in JSON format with match status and explanations.
  agent: verifier_agent
  depends_on: [generate_sql_task, select_segment_task]
